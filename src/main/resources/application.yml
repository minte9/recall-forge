spring:
  application:
    name: recallforge
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

  datasource:
    url: jdbc:postgresql://localhost:5432/recallforge
    username: recallforge
    password: recallforge

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  docker:
    compose:
      enabled: true
      file: compose.yml

server:
  port: 9090
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: RECALLFORGESESSION
        max-age: 30d
        http-only: true
        same-site: lax
        secure: true

recallforge:
  notes:
    path: local_topics/README.md

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4.1-mini

logging:
  level:
    dev.recallforge.service.OpenAiService: INFO

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  login:
    enabled: ${APP_LOGIN_ENABLED:true}
  ai:
    enabled: ${APP_AI_ENABLED:true}
  reviews:
    daily-limit: ${APP_DAILY_REVIEW_LIMIT:20}
    daily-question-limit: ${APP_DAILY_QUESTION_LIMIT:50}