spring:
  application:
    name: recallforge
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID}
            client-secret: ${LINKEDIN_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: LinkedIn
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
            user-info-uri: https://api.linkedin.com/v2/userinfo
            user-info-authentication-method: header
            user-name-attribute: sub

  datasource:
    url: jdbc:postgresql://localhost:5432/recallforge
    username: recallforge
    password: recallforge

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  docker:
    compose:
      enabled: true
      file: compose.yml

server:
  port: 9090
  forward-headers-strategy: framework
  tomcat:
    # Vault upload sends 2 parts per file (file + path); default 50 caps it at ~24 notes.
    max-part-count: 650
  servlet:
    session:
      timeout: 30d
      cookie:
        name: RECALLFORGESESSION
        max-age: 30d
        http-only: true
        same-site: lax
        secure: true

recallforge:
  notes:
    path: local_topics/README.md

openai:
  api-key: ${OPENAI_API_KEY}
  #model: gpt-4.1-mini
  model: gpt-6-luna

logging:
  level:
    dev.recallforge.service.OpenAiService: INFO

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  login:
    enabled: ${APP_LOGIN_ENABLED:true}
  ai:
    enabled: ${APP_AI_ENABLED:true}
  reviews:
    daily-limit: ${APP_DAILY_REVIEW_LIMIT:20}
    daily-question-limit: ${APP_DAILY_QUESTION_LIMIT:50}
    # Per-user totals across all categories. The two limits above are
    # per category, so a vault with many folders would multiply them.
    daily-user-question-limit: ${APP_DAILY_USER_QUESTION_LIMIT:100}
    daily-user-review-limit: ${APP_DAILY_USER_REVIEW_LIMIT:100}
  markdown:
    max-topics-per-user: ${APP_MAX_TOPICS_PER_USER:2000}
    # Optimize is the most expensive AI call (whole file in, whole rewrite
    # out). Also counts toward daily-user-question-limit above.
    daily-optimize-limit: ${APP_DAILY_OPTIMIZE_LIMIT:10}
  goal-days:
    reviews: ${APP_GOAL_DAYS_REVIEWS:10}
    code-challenges: ${APP_GOAL_DAYS_CHALLENGES:3}
  rewards:
    code-challenge-xp: ${APP_REWARD_CODE_CHALLENGE_XP:25}
