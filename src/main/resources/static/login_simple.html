<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recall Forge</title>


<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Inter, Arial, sans-serif;

        background: #f8fafc;
        color: #334155;
    }

    .card {
        width: 420px;
        max-width: 90vw;

        background: white;

        padding: 48px;

        border-radius: 16px;

        box-shadow:
            0 10px 25px rgba(0,0,0,0.08);

        text-align: center;
    }

    .logo {
        font-size: 3rem;
        margin-bottom: 16px;
    }

    h1 {
        font-size: 2rem;
        color: #0f172a;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #64748b;
        line-height: 1.5;
        margin-bottom: 32px;
    }

    .button {
        display: block;

        width: 100%;
        padding: 14px;

        margin-bottom: 14px;

        text-decoration: none;
        text-align: center;

        border-radius: 10px;

        font-weight: 600;

        transition: 0.15s ease;
    }

    .button:hover {
        transform: translateY(-1px);
    }

    .github {
        background: white;
        color: #111827;

        border: 1px solid #d1d5db;
        
    }

    .google {
        background: hsl(210, 94%, 56%);
        color: white;
    }

    .footer {
        margin-top: 24px;

        font-size: 0.9rem;
        color: #94a3b8;
    }

    .logo {
        margin-bottom: 20px;
    }

    .logo img {
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: grayscale(100%);
    }
</style>


</head>

<body>

<div class="card">


<div class="logo">
    <img src="/recall-forge.png" alt="Recall Forge">
</div>

<h1>Recall Forge</h1>

<p class="subtitle">
    Build long-term knowledge through AI-powered spaced repetition.
</p>

<a class="button google"
   href="/oauth2/authorization/google">
    Continue with Google
</a>

<a class="button github"
   href="/oauth2/authorization/github">
    Continue with GitHub
</a>



<div class="footer">
    Sign in to access your learning progress.
</div>


</div>

</body>
</html>
