services:
  postgres:
    image: postgres:16
    container_name: recallforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recallforge
      POSTGRES_USER: recallforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - recallforge-postgres-data:/var/lib/postgresql/data

  app:
    image: minte9/recallforge:${APP_VERSION:-1.0.0}
    container_name: recallforge-app
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recallforge
      SPRING_DATASOURCE_USERNAME: recallforge
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED}
      APP_LOGIN_ENABLED: ${APP_LOGIN_ENABLED}
      APP_AI_ENABLED: ${APP_AI_ENABLED}
      APP_DAILY_REVIEW_LIMIT: ${APP_DAILY_REVIEW_LIMIT:-20}
      APP_DAILY_QUESTION_LIMIT: ${APP_DAILY_QUESTION_LIMIT:-50}
      APP_GOAL_DAYS_REVIEWS: ${APP_GOAL_DAYS_REVIEWS:-10}
      APP_GOAL_DAYS_CHALLENGES: ${APP_GOAL_DAYS_CHALLENGES:-3}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/src/main/resources/static/
    networks:
      - default
      - traefik-net
    volumes:
      - ./src/main/resources/static:/app/src/main/resources/static

volumes:
  recallforge-postgres-data:

networks:
  traefik-net:
    external: true